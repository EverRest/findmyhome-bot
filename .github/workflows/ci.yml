name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_ENV: test
  DATABASE_URL: file:./data/ci.db
  CRITERIA_PATH: ./config/criteria.yaml
  PIPELINE_API_KEY: ci-test-key
  PIPELINE_DRY_RUN: 'true'
  PIPELINE_CRON_ENABLED: 'false'
  FACEBOOK_INGESTION_ENABLED: 'false'
  BULLMQ_ENABLED: 'false'
  OLLAMA_SCORING_ENABLED: 'false'

jobs:
  quality:
    name: Lint, typecheck, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests and coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/lcov-report
          retention-days: 7

  prisma:
    name: Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations on fresh database
        run: |
          mkdir -p data
          npx prisma migrate deploy

      - name: Verify schema matches Prisma models
        run: npx prisma validate
