# Mac: Ollama runs on HOST (Metal). App in Docker talks via host.docker.internal.
# Usage: cp .env.example .env && docker compose --profile mac up -d --build

services:
  app:
    build: .
    profiles: [mac, full]
    env_file: .env
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
    environment:
      DATABASE_URL: file:/app/data/findmyhome.db
      CRITERIA_PATH: /app/config/criteria.yaml
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    profiles: [mac, full]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    profiles: [full]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - '11434:11434'

volumes:
  ollama_data:
  redis_data:
