notes: |
  Family ...

locale: en

hard:
  roomsMin: ...
  roomsMax: ...
  areaMinSqm: ...
  areaMaxSqm: ...
  rentMinEur: ...
  rentMaxEur: ...
  totalCostMaxEur: 950
  zones:
  zoneMatchMode: fuzzy
  # Extra landmarks (bonus, not required)
  metroStations:

soft:
  mustHave:
    - suitable for a family with a child
  niceToHave:
    - close to a park
    - lift / elevator
  avoid:
    - studio
    - 1 room only
    - students only / student housing / room for students

scoring:
  llmWeight: 0.7
  rulesWeight: 0.3
  zoneMissPenalty: 20
  referencePoint:
    name: ...
    lat: ...
    lng: ...
  geocoding:
    enabled: true
    provider: nominatim
    baseUrl: https://nominatim.openstreetmap.org
    minIntervalMs: 1100
    fallbackProvider: photon
    photonBaseUrl: https://photon.komoot.io
    citySuffix: ''
  distanceScore:
    buckets:
      - { maxM: 500, score: 10 }
      - { maxM: 1000, score: 9 }
      - { maxM: 1500, score: 8 }
      - { maxM: 2500, score: 6 }
      - { maxM: 4000, score: 3 }
    missingScore: 5
  rulesProximityBonus: 15

# One-sentence AI tip shown in Telegram (injected into llmRating prompt as {{aiSuggestionPrompt}})
telegram:
  digestMaxRentEur: 800
  aiSuggestion:
    prompt: |
      The JSON "summary" field must be exactly ONE sentence in English (max 30 words).
      Give a practical tip for this family: why it may fit, main trade-off, or what to verify on viewing.
      Do not repeat numeric scores, rent, rooms, or m² from the listing data.

# AI rating: 10 practical criteria × 0–10 → sum 0–100 (objective, from JSON + snippet only)
llmRating:
  reference:
    targetZones: 'Cenisia, Cit Turin, Pozzo Strada, San Donato, Piazza Bernini'
    preferredMetro: 'Bernini, Rivoli, Monte Grappa, Massaua, Pozzo Strada, Marcadè, Rebaudengo, Fermi'
  criteria:
    - key: budgetFit
      label: Budget
      description: '10 if rentEur is 300–900 and totalCostEur (if known) ≤ 950; 0 if rent missing or far outside range; mid if at edges'
    - key: sizeForFamily
      label: Size
      description: '10 if rooms 2–4 and areaSqm 50–90 in JSON; lower if rooms/area missing or clearly wrong for family with child'
    - key: targetZone
      label: Zone
      description: '10 if location/snippet explicitly names a target zone ({{targetZones}}); 5 if only generic Torino; 0 if wrong area'
    - key: dataComplete
      label: Data
      description: '10 if rentEur, rooms, areaSqm, and location are all present; subtract for each missing field'
    - key: costClarity
      label: Costs
      description: '10 if condo/spese/heating costs stated or clearly included; lower if hidden costs likely or not mentioned'
    - key: notStudentShared
      label: Not student
      description: '10 if no student-only, posto letto, stanza singola, Erasmus, solo studenti in snippet; 0 if student housing'
    - key: layoutFit
      label: Layout
      description: '10 for bilocale/trilocale family layout; low for monolocale, studio, single room only'
    - key: listingTrust
      label: Trust
      description: '10 for major portal listing, normal agent text; 0 for scam patterns (Western Union, wire only, WhatsApp-only contact)'
    - key: proximityToReference
      label: Proximity
      description: 'Server-computed from geocoded address; 10 if within 500m of {{referenceName}}; do not score manually'
    - key: descriptionQuality
      label: Details
      description: '10 if snippet has useful extras (floor, lift, condition, balcony); 0 if one line with almost no detail'
  prompt: |
    You score rental listings in Turin for ...).
    Summary for Telegram (locale: {{locale}}):
    {{aiSuggestionPrompt}}

    Hard limits (already enforced before save — scores should align):
    {{hardCriteria}}

    Target zones: {{targetZones}}
    Metro / landmarks to look for in text: {{preferredMetro}}

    Criteria (score 0–10 each; use ONLY listing JSON + snippet):
    {{criteriaKeys}}

    Listing data (JSON):
    {{listingJson}}

    Scoring rules:
    - Use numbers from JSON when present (rentEur, areaSqm, rooms).
    - proximityToReference is computed by the app from geocoding — do NOT include it in your JSON response.
    - If a field is null/missing, score dataComplete and sizeForFamily lower, do not fabricate values.
    - listingTrust: penalize scam phrases; idealista/immobiliare/casa.it style alerts score higher.

    Return ONLY valid JSON (no markdown):
    {{jsonKeys}},
    "summary": "one sentence per aiSuggestion rules",
    "riskLevel": "none" | "low" | "medium" | "high",
    "riskReasons": []

    riskLevel "high" only for scams / messenger-only / wire transfer; otherwise "none" and riskReasons [].
