notes: Test criteria fixture.

locale: en

hard:
  roomsMin: 2
  roomsMax: 3
  areaMinSqm: 60
  areaMaxSqm: 80
  rentMinEur: 500
  rentMaxEur: 1000
  totalCostMaxEur: 1100
  zones:
    - name: Cenisia
      aliases: [cenisia, cit turin]
  zoneMatchMode: fuzzy
  metroStations:
    - bernini

soft:
  mustHave:
    - suitable for a family
  niceToHave:
    - park
  avoid:
    - studio

scoring:
  llmWeight: 0.7
  rulesWeight: 0.3
  zoneMissPenalty: 20

telegram:
  digestMaxRentEur: 800
  aiSuggestion:
    prompt: |
      Write "summary" as one short English sentence for the family.

llmRating:
  reference:
    targetZones: Cenisia, Cit Turin
    preferredMetro: bernini, rivoli
  criteria:
    - key: budgetFit
      label: Budget
    - key: sizeForFamily
      label: Size
    - key: targetZone
      label: Zone
    - key: dataComplete
      label: Data
    - key: costClarity
      label: Costs
    - key: notStudentShared
      label: Not student
    - key: layoutFit
      label: Layout
    - key: listingTrust
      label: Trust
    - key: metroLandmark
      label: Metro
    - key: descriptionQuality
      label: Details
  prompt: |
    Rate listing {{listingJson}} with keys {{jsonKeys}}.
    Hard: {{hardCriteria}}
    Zones: {{targetZones}}
    {{criteriaKeys}}
    {{aiSuggestionPrompt}}
    Return JSON only with scores 0-10, summary, riskLevel, riskReasons.
